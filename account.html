<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/modern-normalize.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/form.css">
    <script type="module" src="js/components.js"></script>
    <title>CRUD</title>
</head>
<body>
    <site-header></site-header>
    <site-nav></site-nav>
    <main>

    <h2>Gerenciador de Notícias (CRUD)</h2>
    <h3>Criar Usuário</h3>
    <div id="mensagem">Preencha os dados para criar um novo usuário</div>
    
    <!-- Formulário para Criar -->
    <form id="usuario_Form">    
        <input type="hidden" id="usuario_Id">
        <input type="text" id="usuario_nome" placeholder="Nome" required>

        <input type="hidden" id="email_Id">
        <input type="email" id="usuario_email" placeholder="XXXX@gmail.com" required>

        <input type="hidden" id="SENHA_ID">
        <input type="password" id="usuario_senha" placeholder="XXXX" required>
        
        
        <button type="submit" id="submitBtn">Criar usuário</button>
    </form>

    <div id="noticiasContainer">   
    </div>

    </main>
    <site-footer></site-footer>

    <script type="module" src="js/account.js"></script>
</body>
</html>
