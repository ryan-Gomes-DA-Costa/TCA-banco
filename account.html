<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; }
        form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; }
        input, textarea, button { padding: 8px; font-size: 16px; }
        button { cursor: pointer; background-color: #007bff; color: white; border: none; }
        button:hover { background-color: #0056b3; }
        #mensagem { margin-bottom: 10px; color: green; font-weight: bold; }   
    </style>
</head>
<body>

    <h2>Gerenciador de Notícias (CRUD)</h2>
    <h3>Criar Usuário</h3>
    <div id="mensagem">Preencha os dados para criar um novo usuário</div>
    
    <!-- Formulário para Criar -->
    <form id="usuario_Form">    
        <input type="hidden" id="usuario_Id">
        <input type="text" id="usuario_nome" placeholder="Nome" required>

        <input type="hidden" id="email_Id">
        <input type="email" id="usuario_email" placeholder="XXXX@gmail.com" required>

        <input type="hidden" id="SENHA_ID">
        <input type="senha" id="usuario_senha" placeholder="XXXX" required>
        
        
        <button type="submit" id="submitBtn">Criar usuário</button>
    </form>

    <div id="noticiasContainer">   
    </div>

    <script src="script.js"></script>
</body>
</html>
