<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmes</title>
    <link rel="stylesheet" href="css/modern-normalize.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/form.css">
    <script type="module" src="js/components.js"></script>
    <script type="module" src="js/lista.js"></script>
</head>
<body>
    <site-header></site-header>
    <site-nav></site-nav>
    <main>
        <h2>Filmes</h2>
        <form id="filtros" class="filtros">
            <div class="campo">
                <label for="filtro_genero">Gênero</label>
                <select id="filtro_genero">
                    <option value="">Todos</option>
                </select>
            </div>
            <div class="campo">
                <label for="filtro_ano">Ano</label>
                <select id="filtro_ano">
                    <option value="">Todos</option>
                </select>
            </div>
            <button type="reset" class="secundario" id="limpar_filtros">Limpar</button>
        </form>
        <div id="mensagem"></div>
        <ul id="lista_filmes" class="lista-filmes"></ul>
    </main>
    <site-footer></site-footer>
</body>
</html>
