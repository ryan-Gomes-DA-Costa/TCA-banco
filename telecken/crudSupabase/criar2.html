<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; }
        form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; }
        input, textarea, button { padding: 8px; font-size: 16px; }
        button { cursor: pointer; background-color: #007bff; color: white; border: none; }
        button:hover { background-color: #0056b3; }
        #mensagem { margin-bottom: 10px; color: green; font-weight: bold; }   
    </style>
</head>
<body>

    <h2>Gerenciador de Notícias (CRUD)</h2>
    <h3>Criar Notícia</h3>
    <div id="mensagem">Preencha os dados para criar uma nova notícia.</div>
    
    <!-- Formulário para Criar -->
    <form id="noticiaForm">    
        <input type="hidden" id="noticiaId">
        <input type="text" id="noticiaTitle" placeholder="Título da notícia" required>
        <textarea id="noticiaBody" placeholder="Conteúdo da notícia" rows="3" required></textarea>
        <button type="submit" id="submitBtn">Criar notícia</button>
    </form>

    <div id="noticiasContainer">   
    </div>

    <script>
        
        const noticiaForm = document.querySelector('#noticiaForm');
        const noticiaTitleInput = document.querySelector('#noticiaTitle');
        const noticiaBodyInput = document.querySelector('#noticiaBody');
        const mensagem = document.querySelector('#mensagem');
        
        const PUBLISHABLE_KEY = 'sb_publishable_hfoApgDMBkWyKsFH6CNI8g_PCJ3dFsE'
        const API_URL = 'https://utwkyqjfrzqbkqmfunki.supabase.co/rest/v1/noticia';

      
        
        //Ouvintes de eventos
        noticiaForm.addEventListener('submit', criarNoticia);
        
        async function criarNoticia(e) {
            e.preventDefault(); 

            const noticiaData = {
                titulo: noticiaTitleInput.value,
                corpo: noticiaBodyInput.value
            };
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        apikey: PUBLISHABLE_KEY,
                        'Content-Type': 'application/json',
                        Prefer: 'return=representation'
                    },
                    body: JSON.stringify(noticiaData)
                });
                const newNoticia = await response.json();
                mensagem.innerHTML = `Notícia criada com sucesso! <br>
                                Preencha o formulário novamente para criar outra notícia.`;
                noticiaForm.reset();
            } catch (error) {
                console.error('Erro ao criar notícia:', error);
            }
        }
        
    </script>
</body>
</html>
