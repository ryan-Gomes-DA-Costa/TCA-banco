<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; }
        button { padding: 8px; font-size: 16px; }
        button { cursor: pointer; background-color: #007bff; color: white; border: none; }
        button:hover { background-color: #0056b3; }
        .noticia-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 4px; }
        .actions { margin-top: 10px; }
        .btn-delete { background-color: #dc3545; }
        #mensagem { margin-bottom: 10px; color: green; font-weight: bold; }
       
    </style>
</head>
<body>

    <h2>Gerenciador de Notícias (CRUD)</h2>
    <h3>Excluir Notícia</h3>
    <div id="mensagem">Escolha uma notícia para excluir.</div>
    
  

    <div id="noticiasContainer">   
    </div>

    <script>
    
        const noticiasContainer = document.querySelector('#noticiasContainer');
        const mensagem = document.querySelector('#mensagem');
        
        const PUBLISHABLE_KEY = 'sb_publishable_hfoApgDMBkWyKsFH6CNI8g_PCJ3dFsE'
        const API_URL = 'https://utwkyqjfrzqbkqmfunki.supabase.co/rest/v1/noticia';

        //Json com os dados do servidor será armazenado nesta variável
        let localNoticias = [];
        

        // READ - Buscar as noticias *********
        async function buscarNoticias() {
            try {
                const response = await fetch(`${API_URL}`, {
                    headers: {
                        apikey: PUBLISHABLE_KEY
                    }
                });
                localNoticias = await response.json();
                renderNoticias();
            } catch (error) {
                noticiasContainer.innerHTML = 'Erro ao carregar os dados.';
            }
        }

        // Renderizar os elementos na tela
        function renderNoticias() {
            if (localNoticias.length === 0) {
                noticiasContainer.innerHTML = '<p>Nenhuma notícia encontrada.</p>';
                return;
            }

            noticiasContainer.innerHTML = '';
            localNoticias.forEach(noticia => {
                noticiasContainer.innerHTML += `
                    <div class="noticia-card" id="noticia-${noticia.id}">
                        <h3>${noticia.titulo}</h3>
                        <p>${noticia.corpo}</p>
                        <div class="actions">
                            <button class="btn-delete" onclick="deletarNoticia(${noticia.id})">Deletar</button>
                        </div>
                    </div>
                `;
            });
        }

       //  DELETE - Função que envia o DELETE para a API *********
        async function deletarNoticia(id) {

            if (!confirm('Deseja realmente excluir esta notícia?')) return;

            try {
                const url = `${API_URL}?id=eq.${id}`;
                let resposta = await fetch(url, {
                    method: 'DELETE',
                    headers: {
                        apikey: PUBLISHABLE_KEY
                    }
                    
                });
               mensagem.innerHTML = `Notícia excluída com sucesso! <br>
                                    Escolha outra notícia para excluir.`;       
               buscarNoticias(); // Atualiza a lista de notícias após a exclusão   
                                } catch (error) {
                console.error('Erro ao excluir notícia:', error);
            }
        }
        buscarNoticias(); // Carrega as notícias ao iniciar a página        
    </script>
</body>
</html>
